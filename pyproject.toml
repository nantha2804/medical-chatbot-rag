[project]
name = "medical-chatbot-rag"
version = "0.1.0"
description = "A document-grounded medical information chatbot built with Streamlit and RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-chroma>=1.0,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-core>=1.0,<2.0",
    "langchain-groq>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "fastembed>=0.2,<1.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "streamlit==1.49.1",
    "onnxruntime==1.18.1",
    "numpy>=1.26.4",
]

[dependency-groups]
notebook = [
    "ipykernel>=6.29",
    "langchain-classic>=1.0,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
